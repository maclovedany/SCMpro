[project]
name = "scm-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
engine = "scm_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scm_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
